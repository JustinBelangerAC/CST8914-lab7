<!DOCTYPE html>
<html lang="en">

<head>
  <title>Form validation with messages on top: Code example - Accessibility Developer Guide example</title>
  <meta charset="utf-8">
  <style>
    .control,
    fieldset {
      margin: 6px 0;
    }

    label {
      display: inline-block;
      width: 120px;
      vertical-align: top;
    }

    input+label {
      width: auto;
    }

    .error,
    .required {
      color: red;
    }

    fieldset ul {
      margin: 0;
    }
  </style>
</head>

<body>
  <h1>Feedback form</h1>
  <form>

    <fieldset>
      <legend>Basic information</legend>
      <div class="control">
        <label for="name">Full name <span class="required">(required)</span></label>
        <input id="name" name="name" type="text"/>
      </div>

      <div class="control">
        <label for="biography">Biography <span class="required">(required)</span></label>
        <textarea id="biography" name="biography" type="text" aria-describedby="bio_description"></textarea>
        <span id="bio_description">Include examples on your skills in JavaScript.</span>
      </div>

    </fieldset>

    <fieldset>
      <legend>Gender <span class="required">(required)</span></legend>
      <div class="control">
        <input id="gender_male" name="gender" type="radio" value="male">
        <label for="gender_male">Male</label>
      </div>
      <div class="control">
        <input id="gender_female" name="gender" type="radio" value="female">
        <label for="gender_female">Female</label>
      </div>
      <div class="control">
        <input id="gender_other" name="gender" type="radio" value="other">
        <label for="gender_other">Other</label>
      </div>
    </fieldset>

    <div class="control">
      <input id="accept_agbs" name="accept_agbs" type="checkbox" value="1" />
      <label for="accept_agbs">I accept the terms and conditions <span class="required">(required)</span></label>
    </div>

    <div class="control">
      <input name="validate" type="hidden" value="1" /><input type="submit" value="Register" />
    </div>
  </form>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"
    integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
  <script>"use strict";

    ;
    (function () {
      var validateInput;

      $.urlParam = function (name) {
        var results;
        results = new RegExp('[?&]' + name + '=([^&#]*)').exec(window.location.href);

        if (results === null) {
          return null;
        } else {
          return decodeURI(results[1]) || null;
        }
      };

      validateInput = function validateInput(input, message) {
        var $elementToDescribe, $error, $errorContainer, $fieldset, $input, $referencedElement, value;
        $input = $('[name="' + input + '"]');

        // if this is the first error, create the error fieldset to add all the errors in
        if ((value = $.urlParam(input)) === null) {
          if ($('fieldset.errors').length === 0) {
            $('form').prepend('<fieldset class="errors"><legend>Errors</legend><ul></ul></fieldset>');
          }

          $referencedElement = null;
          $elementToDescribe = null;
          $errorContainer = $('fieldset.errors ul');

          if ($input.is(':radio')) {
            $fieldset = $input.closest('fieldset');
            $elementToDescribe = $fieldset;
            $referencedElement = $input.filter(':first');
          } else {
            $elementToDescribe = $input;
            $referencedElement = $input;
          }
          // R.G. hint: fix next line ;)
          $error = $('<a class="error" tabindex=0 id=' + input + '_description> ' + message + '</a>'); // need to add tabindex to elements that are added programmatically, also need to add the ID for the describe by, also need to add the error class to it so that the error count works and the color shows up
          
          // move the focus to the element when we click on the error
          $error.click(function (e) {
            // If we rely on the link's href pointing to the input's ID, it doesn't trigger forms mode in screen readers
            $referencedElement.focus();
            return e.preventDefault();
          });

          // move the focus to the element when we press enter on the error
          $error.keydown(function (e) {
            // check if the key was enter
            if (e.key === 'Enter') {
              $referencedElement.focus();
              return e.preventDefault();
            }
          })

          // get the current aria-describe by
          let oldDesc = $elementToDescribe.attr('aria-describedby');
          let newDesc = input + '_description';

          // check if describe-by is not empty
          if (oldDesc !== undefined) {
            // add the old attr to the new one
            newDesc = newDesc + " " + oldDesc;
          }

          // set the aria-describe by to the old one + the error description one, I had to do this because "bio" already had a description label and this was removing it
          $elementToDescribe.attr('aria-describedby', newDesc);
          $errorContainer.append('<li>').find('li:last').append($error);

          if ($(':not(form):focus').length === 0) {
            // See https://stackoverflow.com/questions/46134247/jquery-setting-focus-doesnt-work-in-ie11/
            // this checks if the current focused element is outside of the form
            // every focusable element resides inside the form, so this is useless
            // the submit button that causes this code to happen also resides in the form
          }
        } else {
          if ($input.is(':checkbox')) {
            $input.attr('checked', true);
          }

          if ($input.is(':radio')) {
            return $input.filter('[value="' + value + '"]').attr('checked', true);
          } else {
            return $input.val(value);
          }
        }
      };

      $(document).ready(function () {
        if ($.urlParam('validate')) {
          validateInput('name', 'Please enter your name!');
          validateInput('biography', 'Please tell us something about your history!');
          validateInput('gender', 'Please tell us your gender!');
          validateInput('accept_agbs', 'You must accept our terms and conditions!');

          if ($('.error').length === 0) {
            return alert('All inputs are valid.');
          }
        }
      });
    }).call(void 0);</script>

</body>

</html>
